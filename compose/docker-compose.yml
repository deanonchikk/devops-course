services:
  app:
    image: nginx:stable-alpine
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - app_net

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_net

networks:
  app_net:
    name: course_compose_net
